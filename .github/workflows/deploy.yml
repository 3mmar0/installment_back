name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          ARCHIVE="${RUNNER_TEMP}/release.tar.gz"
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            -C "$GITHUB_WORKSPACE" .
          cp "$ARCHIVE" "$GITHUB_WORKSPACE/release.tar.gz"

      - name: Upload release package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INSTALLMENT_SSH_HOST }}
          username: ${{ secrets.INSTALLMENT_SSH_USER }}
          key: ${{ secrets.INSTALLMENT_SSH_KEY }}
          source: "release.tar.gz"
          target: "/tmp/installment-back-release"
          strip_components: 0

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INSTALLMENT_SSH_HOST }}
          username: ${{ secrets.INSTALLMENT_SSH_USER }}
          key: ${{ secrets.INSTALLMENT_SSH_KEY }}
          source: "scripts/deploy-installment-back.sh"
          target: "/home/deploy/bin/"
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.INSTALLMENT_SSH_HOST }}
          username: ${{ secrets.INSTALLMENT_SSH_USER }}
          key: ${{ secrets.INSTALLMENT_SSH_KEY }}
          script_stop: true
          script: |
            chmod +x /home/deploy/bin/deploy-installment-back.sh
            bash /home/deploy/bin/deploy-installment-back.sh /tmp/installment-back-release/release.tar.gz
