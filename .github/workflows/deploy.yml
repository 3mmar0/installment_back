name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.INSTALLMENT_SSH_HOST }}
          username: ${{ secrets.INSTALLMENT_SSH_USER }}
          key: ${{ secrets.INSTALLMENT_SSH_KEY }}
          script_stop: true
          script: |
            bash /home/deploy/bin/deploy-installment-back.sh
