[program:installment-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clients/installment-back.ammarelgndy.cloud/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/clients/installment-back.ammarelgndy.cloud/storage/logs/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopsignal=TERM
stopwaitsecs=30
